<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="./icone.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIC Chatbot</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-image: url('fundoPIC.jpg'); /* Sua logo de fundo */
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #f8f9fa; 
        }

        /* Canto Superior Direito (Logo e Sair) */
        #top-bar {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            color:#d47a3e
        }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: rgb(244, 104, 45);
            letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }
        #btn-sair {
            background: rgba(220, 53, 69, 0.8); backdrop-filter: blur(5px);
            color: white; border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px;
            border-radius: 8px; font-weight: 600; cursor: pointer; display: none; transition: 0.2s;
        }
        #btn-sair:hover { background: rgba(220, 53, 69, 1); }
        
        /* Container Principal - Vidro Fosco */
        .container { 
            width: 100%; max-width: 450px; 
            background: rgba(10, 15, 30, 0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); overflow: hidden; 
            display: flex; flex-direction: column; transition: all 0.3s ease; 
        }
        .header { background: rgba(0, 0, 0, 0.4); color: white; padding: 20px; text-align: center; font-size: 1.2rem; font-weight: 600; border-bottom: 2px solid #d47a3e; }
        
        /* Telas */
        #login-screen { padding: 30px; }
        #chat-screen { 
            display: none; 
            height: 85vh; 
            max-height: 700px; 
            max-width: 900px; /* Define a largura máxima exclusiva para o chat */
        }
        
        /* Formulários e Inputs */
        .form-group { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        input { width: 100%; padding: 14px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; background: rgba(255, 255, 255, 0.1); color: white; }
        input::placeholder { color: rgba(255, 255, 255, 0.6); }
        input:focus { border-color: #d47a3e; background: rgba(255, 255, 255, 0.15); }
        
        /* Botões Base */
        button.btn-primary { padding: 14px; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; background: #d47a3e; }
        button.btn-primary:hover { background: #b5632d; }
        #btnRegister { background: #28a745; display: none; }
        #btnRegister:hover { background: #218838; }
        
        /* Links */
        .link { text-align: center; font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); cursor: pointer; margin-top: 20px; transition: color 0.2s; }
        .link:hover { color: #d47a3e; text-decoration: underline; }
        
        /* Área do Chat */
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; background: transparent; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 18px; max-width: 85%; line-height: 1.4; font-size: 0.95rem; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        .user-msg { background: #d47a3e; color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .bot-msg { background: rgba(255, 255, 255, 0.1); color: white; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        /* Área de Digitação */
        .input-area { padding: 15px; background: rgba(0, 0, 0, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 10px; align-items: center; }
        .input-area input { margin: 0; flex: 1; }
        .input-area button { width: auto; padding: 14px 20px; background: #d47a3e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .input-area button:hover { background: #b5632d; }
        
        /* Carregamento */
        .loading { font-size: 0.85rem; color: #d47a3e; text-align: center; padding: 10px; display: none; font-style: italic; margin: 0; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Topo Flutuante -->
    <div id="top-bar">
        <span class="logo-text">ChatbotPIC</span>
        <button id="btn-sair" onclick="fazerLogout()">Sair</button>
    </div>

    <!-- Tela de Login / Cadastro -->
    <div id="login-screen" class="container">
        <div class="header" id="form-title">Acesso ao Chatbot</div>
        <div class="form-group">
            <input type="text" id="name" placeholder="Nome Completo" style="display: none;">
            <input type="email" id="login" placeholder="E-mail Institucional">
            <input type="password" id="password" placeholder="Senha">
            <button id="btnLogin" class="btn-primary" onclick="fazerLogin()">Entrar</button>
            <button id="btnRegister" class="btn-primary" onclick="registrarUsuario()" style="display: none; background: #28a745;">Criar Conta</button>
        </div>
        <div id="toggle-link" class="link" onclick="alternarTela()">Primeiro acesso? Cadastre-se aqui.</div>
    </div>

    <!-- Tela de Chat -->
    <div id="chat-screen" class="container">
        <div class="header">Chatbot PIC</div>
        <div class="chat-box" id="chat-box"></div>
        <div id="loading" class="loading">O assistente está processando...</div>
        <div class="input-area">
            <input type="text" id="prompt" placeholder="Escreva sua mensagem..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <script>
        const API_URL = "https://chatbot-pic.onrender.com/api";
        let userId = null;
        let modoCadastro = false;

        function alternarTela() {
            modoCadastro = !modoCadastro;
            document.getElementById("form-title").innerText = modoCadastro ? "Novo Cadastro" : "Acesso ao Chatbot";
            document.getElementById("name").style.display = modoCadastro ? "block" : "none";
            document.getElementById("btnLogin").style.display = modoCadastro ? "none" : "block";
            document.getElementById("btnRegister").style.display = modoCadastro ? "block" : "none";
            document.getElementById("toggle-link").innerText = modoCadastro ? "Já tem conta? Voltar para o login." : "Primeiro acesso? Cadastre-se aqui.";
        }

        async function registrarUsuario() {
            const name = document.getElementById("name").value;
            const login = document.getElementById("login").value;
            const password = document.getElementById("password").value;
            if (!name || !login || !password) return alert("Por favor, preencha todos os campos.");

            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, login, password })
                });
                if (response.ok) {
                    alert("Conta criada com sucesso! Você já pode fazer login.");
                    alternarTela();
                } else alert("Não foi possível cadastrar. Verifique se o e-mail já está em uso.");
            } catch (error) { alert("Erro de conexão. Verifique se o backend está rodando."); }
        }

        async function fazerLogin() {
            const login = document.getElementById("login").value;
            const password = document.getElementById("password").value;
            if (!login || !password) return alert("Insira suas credenciais.");

            try {
                const response = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                if (response.ok) {
                    const user = await response.json();
                    userId = user.id;
                    
                    document.getElementById("btn-sair").style.display = "block";
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("chat-screen").style.display = "flex";
                    carregarHistorico();
                } else alert("E-mail ou senha incorretos.");
            } catch (error) { alert("Erro de conexão com o servidor."); }
        }

        function fazerLogout() {
            userId = null;
            document.getElementById("chat-box").innerHTML = "";
            document.getElementById("login").value = "";
            document.getElementById("password").value = "";
            
            document.getElementById("btn-sair").style.display = "none";
            document.getElementById("chat-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
        }

        async function carregarHistorico() {
            const response = await fetch(`${API_URL}/chat/history/${userId}`);
            if (response.status === 200) {
                const history = await response.json();
                history.forEach(msg => {
                    addMessage(msg.prompt, 'user-msg');
                    if (msg.response) addMessage(msg.response, 'bot-msg');
                });
            }
        }

        async function enviarMensagem() {
            const input = document.getElementById("prompt");
            const prompt = input.value;
            if (!prompt.trim()) return;

            addMessage(prompt, 'user-msg');
            input.value = "";
            document.getElementById("loading").style.display = "block";

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, prompt })
                });
                const data = await response.json();
                addMessage(data.response, 'bot-msg');
            } catch (error) {
                addMessage("Sistema indisponível no momento.", 'bot-msg');
            } finally {
                document.getElementById("loading").style.display = "none";
            }
        }

        function addMessage(text, className) {
            const box = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            
            let textoFormatado = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            textoFormatado = textoFormatado.replace(/\n/g, '<br>');
            msgDiv.innerHTML = textoFormatado;
            
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
